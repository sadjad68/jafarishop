version: '3.5'

services:
  app-core:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
      - ./docker/php/fpm/www.conf:/usr/local/etc/php-fpm.d/www.conf
    depends_on:
      - mysql
    user: "www"
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
      - ./docker/php/fpm/www.conf:/usr/local/etc/php-fpm.d/www.conf
    depends_on:
      - mysql
    user: "www"
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]

  webserver:
    image: nginx:alpine
    restart: unless-stopped
    tty: true
    ports:
      - "${APP_PORT}:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/conf.d/:/etc/nginx/conf.d/
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          memory: 64M

  mysql:
    image: mysql:8.4.0
    ports:
      - "3310:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    restart: unless-stopped
    volumes:
      - mysql_data_core:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/my.cnf


  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "${APP_PORT_PHPMYADMIN}:80"
    environment:
      - PMA_ARBITRARY=1
      - PMA_HOST=mysql
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - PMA_PORT=${DB_PORT}
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 500M
        reservations:
          memory: 500M
    volumes:
      - ./docker/phpmyadmin/php.ini:/usr/local/etc/php/conf.d/phpmyadmin.ini

volumes:
  mysql_data_core:
